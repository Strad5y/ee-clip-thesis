# AlphaEarth-Kontrolllauf (2026-09-21, Jakob), analog configs/tessera_v1_predup_control.yaml:
# identisch zu configs/ae_v1.yaml (gleiche Hyperparameter, gleiches Early Stopping), trainiert auf
# der HEUTIGEN, UNdeduplizierten pixels_ae.parquet, aber mit torch.manual_seed(0) (Wrapper
# train_ae_v1_predup_control.py). Unterscheidet sich von configs/ae_v1_dedup.yaml NUR in der
# Deduplizierung. Der fuer die Arbeit geltende Vergleich ist Kontrolllauf vs. Dedup-Lauf, nicht
# alter Checkpoint (unseeded) vs. Dedup-Lauf (siehe MANIFEST.md).
backbone: ae
ablation: v1_predup_control   # -> Checkpoint-Ordner checkpoints/ae_v1_predup_control/ (train.py: run_name = backbone_ablation)

ee_dim: 64
text_dim: 1024
latent_dim: 256
hidden_dim: 256
dropout: 0.1

# AlphaEarth ist bereits L2-normalisiert - No-Op, aber explizit gesetzt (nicht durch
# Weglassen); ein Z-Score wuerde die Einheitsnorm zerstoeren. Siehe normalize.py.
normalization: none

data:
  # Phase 7 (CLAUDE_CODE_TASKS_phase4_7.md): Pixel-Ebene statt POI-Ebene. Split steht schon
  # in pixels_ae.parquet (build_splits_pixels.py), kein splits_path/poi_text_path mehr noetig.
  pixels_path: data/processed/pixels_ae.parquet
  text_embeddings_path: data/processed/pixel_text_embeddings.parquet

train:
  batch_size: 256
  lr: 1.0e-3   # backbone-spezifisch kalibriert (LR-Sweep 1e-4/3e-4/1e-3, je 5 Epochen): fuer AlphaEarth
               # bringt 1e-3 klar besseren recall@10_diag bei stabiler Temperatur - siehe tessera_v1.yaml,
               # wo dieselbe Rate stattdessen die Temperatur beschleunigt weglaufen liess, ohne Recall-Vorteil
  weight_decay: 0.01
  epochs: 100
  patience: 10
  early_stopping_metric: recall@10_diag   # nicht val_loss - haengt bei SigLIP an lernbarer Temp/Bias, kein verlaessliches Stoppkriterium
  device: cuda   # torch 2.13.0+cu130 verifiziert, GB10 verfuegbar
  temp_guard: 50.0   # Nutzervorgabe (Phase-7-Nachtrag): 25.0 hat den vorigen Lauf mitten in
                      # monotoner recall@10_diag-Verbesserung abgeschnitten (Temperaturzuwaechse
                      # wurden pro Epoche kleiner: 14.4->17.4->20.0->21.9->23.3->24.3->25.3 -
                      # Konvergenzmuster, kein Weglaufen). Early Stopping soll ueber Patience 10
                      # auf recall@10_diag greifen, nicht ueber die Temperatur.
  num_workers: 0   # DGX Spark: unified CPU/GPU-Memory, Worker forken den Prozess - nicht ohne Grund erhoehen

loss:
  init_t: 10.0
  init_b: -10.0
