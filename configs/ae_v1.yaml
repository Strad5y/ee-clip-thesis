backbone: ae
ablation: v1

ee_dim: 64
text_dim: 1024
latent_dim: 256
hidden_dim: 256
dropout: 0.1

# AlphaEarth ist bereits L2-normalisiert - No-Op, aber explizit gesetzt (nicht durch
# Weglassen); ein Z-Score wuerde die Einheitsnorm zerstoeren. Siehe normalize.py.
normalization: none

data:
  pairs_path: data/processed/pairs_ae.parquet   # TODO: entsteht erst, sobald ein AlphaEarth-Raster vorliegt
  text_embeddings_path: data/processed/text_embeddings.parquet
  poi_text_path: data/interim/poi_text.parquet   # fuer pos_mask (byte-identischer Textvergleich, siehe train.py::build_pos_mask)
  splits_path: data/splits/splits_london.csv

train:
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 100
  patience: 10   # Early Stopping auf val_loss
  device: cpu
  coverage_sampling: true
  num_workers: 0   # DGX Spark: unified CPU/GPU-Memory, Worker forken den Prozess - nicht ohne Grund erhoehen

loss:
  init_t: 10.0
  init_b: -10.0
