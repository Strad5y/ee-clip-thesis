# Basis-Template. Backbone und Ablation sind Parameter, KEIN Config-pro-Skript-Fork
# (settled decision, CLAUDE.md: ein train.py, per Config gesteuert).
# Konkrete Instanzen: siehe tessera_v1.yaml, ae_v1.yaml.

backbone: tessera   # tessera (128-dim) | ae (64-dim) - settled: separate Two-Tower-Modelle pro Backbone
ablation: v1         # v1 | v2 | v3 (siehe build_ablation_sets.py) - V2/V3 brauchen den Crosswalk, aktuell nur v1 nutzbar

ee_dim: 128
text_dim: 1024       # Qwen3-Embedding-4B, MRL-Truncation 2560->1024 (settled decision)
latent_dim: 256       # shared latent dim d=256 (settled decision)
hidden_dim: 256
dropout: 0.1

# zscore (TESSERA) | none (AlphaEarth, bereits L2-normalisiert) - siehe normalize.py.
# Stats werden AUSSCHLIESSLICH auf dem Trainings-Split gefittet, nie auf dem Gesamtdatensatz.
normalization: zscore

data:
  # Phase 7 (CLAUDE_CODE_TASKS_phase4_7.md): Pixel-Ebene statt POI-Ebene.
  pixels_path: data/processed/pixels_tessera.parquet
  text_embeddings_path: data/processed/pixel_text_embeddings.parquet
  norm_stats_path: data/processed/norm_stats_tessera_pixels.json   # nur bei normalization: zscore genutzt

train:
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.01
  epochs: 100
  patience: 10   # Early Stopping auf val_loss
  device: cpu
  num_workers: 0   # DGX Spark: unified CPU/GPU-Memory, Worker forken den Prozess - nicht ohne Grund erhoehen

loss:
  init_t: 10.0
  init_b: -10.0
